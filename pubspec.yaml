name: filbert
description: "Filbert Paint Studio — an app for oil painters."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

workspace:
  - packages/canvas_detect

dependencies:
  dartcv4: ^2.3.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  exif: ^3.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  image_picker: ^1.2.4
  image_picker_android: ^0.8.13+25
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.8
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.10
  build_runner: ^2.17.1
  drift_dev: ^2.35.3

flutter:
  uses-material-design: true

# Native build settings for OpenCV (dartcv4). Default modules (core, imgproc,
# imgcodecs) are all M1 needs. CMake and Ninja come from the Android SDK.
hooks:
  user_defines:
    dartcv4:
      prefer_android_cmake: true
      prefer_android_ninja: true
      macos:
        generator: Ninja
