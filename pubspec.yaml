name: filbert
description: "Filbert Paint Studio — an app for oil painters."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

workspace:
  - packages/canvas_detect
  - packages/sync_engine

dependencies:
  canvas_detect:
    path: packages/canvas_detect
  # Exact, as in packages/canvas_detect (safe_cv.dart, m1-design §7).
  dartcv4: 2.3.1
  # 0.9 needs cross_file 0.4, which image_picker does not allow yet.
  desktop_drop: ^0.8.4
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  exif: ^3.3.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  gal: 3.0.1
  go_router: ^18.1.4
  image_picker: ^1.2.4
  image_picker_android: ^0.8.13+25
  material_ui: ^1.1.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.8
  sync_engine:
    path: packages/sync_engine
  uuid: ^4.6.0
  device_info_plus: ^13.3.0
  google_sign_in: ^7.2.0
  googleapis: ^19.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.10
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # Viewing aids drawn live (m2-design §5.3).
  shaders:
    - shaders/view_aids.frag

# Native build settings for OpenCV (dartcv4). Default modules (core, imgproc,
# imgcodecs) are all M1 needs. CMake and Ninja come from the Android SDK.
hooks:
  user_defines:
    dartcv4:
      prefer_android_cmake: true
      prefer_android_ninja: true
      macos:
        generator: Ninja
