# App icons: `dart run flutter_launcher_icons` after changing assets/icon/
# (made by tool/make_app_icon.swift from the artwork).
flutter_launcher_icons:
  image_path: assets/icon/full.png
  android: true
  # Adaptive icon: the artwork at 0.78× on its own teal, so the launcher's
  # mask (safe circle: the middle 61%) keeps the whole brush.
  adaptive_icon_background: "#32A6A7"
  adaptive_icon_foreground: assets/icon/android_foreground.png
  adaptive_icon_foreground_inset: 0
  ios: false
  macos:
    generate: true
    image_path: assets/icon/full.png
