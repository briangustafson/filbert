name: macOS build

# Proves the Mac app compiles (m3-design §2, proposal 8). Runs on every PR
# and on main, now that the repo is public and macOS minutes are free; it
# can still be started by hand (Actions → "macOS build" → Run workflow).
# The macOS integration test runs locally
# (`flutter test integration_test -d macos`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  # As in ci.yml: superseded PR runs are cancelled; runs on main finish, so
  # their cache is saved for PRs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      # OpenCV for macOS (dartcv4 build hooks), as in ci.yml.
      - name: Cache native builds
        uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner
          key: hooks-macos-${{ runner.os }}-${{ runner.arch }}-flutter3.50.0-${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'packages/*/pubspec.yaml') }}

      - name: Pub get
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build

      - name: macOS debug build
        run: flutter build macos --debug
