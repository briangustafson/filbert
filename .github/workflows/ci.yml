name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish, because
  # only caches saved on main are shared with PRs (the OpenCV build cache).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # OpenCV's native build (dartcv4 build hooks) runs once per target (Linux
    # for the tests, arm64 for the APK) unless restored from the cache below.
    timeout-minutes: 45
    steps:
      # Each OpenCV build takes ~1 GB and the runner has ~14 GB free, so
      # remove preinstalled toolchains this project never uses (~20 GB).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift
          df -h /

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      # Native build outputs (OpenCV via dartcv4). Rebuilt only when
      # dependencies or their build settings (pubspec.yaml user_defines)
      # change.
      - name: Cache native builds
        uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner
          key: hooks-${{ runner.os }}-flutter3.50.0-${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'packages/*/pubspec.yaml') }}

      - name: Pub get
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test app
        run: flutter test

      - name: Test canvas_detect
        working-directory: packages/canvas_detect
        run: dart test

      # Fails if detection gets worse on the evaluation set (m1-design §6.5).
      - name: Evaluate canvas detection
        working-directory: packages/canvas_detect
        run: dart run bin/evaluate.dart --check

      # Proves the Android app compiles; one ABI is enough for that (release
      # builds include all of them).
      - name: Android debug build
        run: flutter build apk --debug --target-platform android-arm64

      - name: Disk space left
        if: always()
        run: df -h /

  # The M1 flow end to end on an Android emulator (integration_test/,
  # m1-design §8). A separate job so it runs alongside `build`.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_LEVEL: 35
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift
          df -h /

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      # OpenCV for the emulator's ABI (x86_64), cached apart from `build`'s.
      - name: Cache native builds
        uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner
          key: hooks-emulator-${{ runner.os }}-flutter3.50.0-${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'packages/*/pubspec.yaml') }}

      - name: Pub get
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A booted emulator snapshot, so later runs skip the cold boot.
      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-x86_64

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created."

      - name: Integration test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test integration_test -d emulator-5554
