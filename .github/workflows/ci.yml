name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # OpenCV's native build (dartcv4 build hooks) runs once per target (Linux
    # for the tests, arm64 for the APK) unless restored from the cache below.
    timeout-minutes: 45
    steps:
      # Each OpenCV build takes ~1 GB and the runner has ~14 GB free, so
      # remove preinstalled toolchains this project never uses (~20 GB).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift
          df -h /

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      # Native build outputs (OpenCV via dartcv4). Rebuilt only when
      # dependencies or their build settings (pubspec.yaml user_defines)
      # change.
      - name: Cache native builds
        uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner
          key: hooks-${{ runner.os }}-flutter3.50.0-${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'packages/*/pubspec.yaml') }}

      - name: Pub get
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test app
        run: flutter test

      - name: Test canvas_detect
        working-directory: packages/canvas_detect
        run: dart test

      # Proves the Android app compiles; one ABI is enough for that (release
      # builds include all of them).
      - name: Android debug build
        run: flutter build apk --debug --target-platform android-arm64

      - name: Disk space left
        if: always()
        run: df -h /
